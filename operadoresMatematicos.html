<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Operadores Matemáticos</title>
</head>
<body>
  <a href="index.html">HOME</a>
    <section id="operadores-matematicos">
        <h2 id="tituloPagina">Operadores Matemáticos</h2>
      
        <p class="texto">
          Realizam cálculos: soma (<code>+</code>), subtração (<code>-</code>), multiplicação (<code>*</code>),
          divisão (<code>/</code>), resto (<code>%</code>) e exponenciação (<code>**</code>).
        </p>
       
        <pre><code class="codeOpMTM">let a = 10, b = 3;
      console.log(a + b); // 13
      console.log(a % b); // 1
      console.log(a ** 2); // 100</code></pre>
        <div class="texto" id="matematicos-output">Clique no botão para ver os cálculos.</div>
        <button id="botao" onclick="exibirOperadoresMatematicos()">Ver Exemplo Prático</button>
      </section>

      <script>
      function exibirOperadoresMatematicos() {
        let a = 10, b = 3;
        let resultado = 
          `a = ${a}, b = ${b}\n\n` +
          `a + b = ${a + b}\n` +
          `a % b = ${a % b} (resto da divisão)\n` +
          `a ** 2 = ${a ** 2} (a elevado a 2)`;
        document.getElementById("matematicos-output").innerText = resultado;
      }
    </script>
</body>
</html>
